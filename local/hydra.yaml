# Local Hydra config, mirrors chart/values.yaml's hydra.hydra.config block
# with dev/localhost values instead of helmvars/dev.yaml's real domain.
serve:
  public:
    port: 4444
  admin:
    port: 4445
strategies:
  access_token: jwt
ttl:
  access_token: 10m
  refresh_token: 720h
urls:
  self:
    issuer: http://localhost:4444/
  login: http://localhost:3001/
  consent: http://localhost:3001/consent
  logout: http://localhost:3001/logout
oauth2:
  allowed_top_level_claims: [user_type, company_id, role_ids, authz_version, user_version]
  token_hook:
    url: http://host.docker.internal:8080/hooks/token
    auth:
      type: api_key
      config:
        in: header
        name: X-Hook-Key
        # value comes from the OAUTH2_TOKEN_HOOK_AUTH_CONFIG_VALUE env var
        # in docker-compose.yaml (see the hydra service) — never put it here.
