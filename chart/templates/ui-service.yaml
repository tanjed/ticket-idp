{{- if .Values.ui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "idp.uiName" . }}
  labels: {{- include "idp.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: idp
    app.kubernetes.io/component: ui
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - { name: http, port: 3001, targetPort: http }   # 3001 = the same URL as in docker-compose
{{- end }}
