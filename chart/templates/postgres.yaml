# Hand-written (Bitnami's Postgres chart went paid; an operator is a cluster-wide prerequisite).
# One StatefulSet hosts Hydra's and Kratos's databases.
#
# CAUTION: postgres:16-alpine reads POSTGRES_PASSWORD and runs initdb scripts (including the
# extraDatabases one) only on first boot. Rotating the password later needs ALTER USER inside
# Postgres, or the DSNs stop working; a new extraDatabases name needs CREATE DATABASE by hand.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{- include "idp.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: idp, app.kubernetes.io/component: postgres, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: idp, app.kubernetes.io/component: postgres, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: POSTGRES_USER, value: {{ .Values.postgres.username | quote }} }
            - { name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }} }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.postgres.name }}, key: password } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data, subPath: pgdata }
            - { name: initdb, mountPath: /docker-entrypoint-initdb.d }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", {{ .Values.postgres.username | quote }}] }
          livenessProbe:
            exec: { command: ["pg_isready", "-U", {{ .Values.postgres.username | quote }}] }
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: initdb
          configMap:
            name: {{ .Release.Name }}-postgres-initdb
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: {{ .Values.postgres.storageSize }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{- include "idp.labels" . | nindent 4 }}
  annotations:
    bus.io/domain: {{ include "idp.domain" . | quote }}
spec:
  clusterIP: None   # headless
  selector: { app.kubernetes.io/name: idp, app.kubernetes.io/component: postgres, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-postgres-initdb
  labels: {{- include "idp.labels" . | nindent 4 }}
data:
  01-create-extra-databases.sh: |
    #!/bin/sh
    set -e
    {{- range .Values.postgres.extraDatabases }}
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" -c "CREATE DATABASE {{ . }} OWNER $POSTGRES_USER;"
    {{- end }}
