# Hydra config from config/hydra/ (shared with docker-compose), verbatim. Mounted at /etc/hydra.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "idp.hydraExtraName" . }}
  labels: {{- include "idp.labels" . | nindent 4 }}
data:
  {{- range $path, $_ := .Files.Glob "config/hydra/*" }}
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
