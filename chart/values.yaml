# Public base domain: the IdP is at idp.<domain>, the UI at login.<domain>. Set it in helmvars/.
domain: ""

replicas: 1   # Hydra pod count

# Names of pre-created Secrets. This chart never creates secrets.
secrets:
  # keys: password, dsn (Hydra's connection string: same password, host <release>-postgres:5432).
  postgres: { name: idp-postgres }
  hydra: { name: idp-hydra }         # keys: secretsSystem, secretsCookie
  kratos: { name: idp-kratos }       # keys: dsn, secretsDefault, secretsCookie, secretsCipher (32 bytes)
  # keys: cookieSecret, emailTokenSecret, inviteTokenSecret.
  ui: { name: idp-ui }

# The login UI (../ui). image and kafka.brokers have no default: set them in helmvars/.
ui:
  enabled: true
  image: { repository: "", tag: "" }
  replicas: 1
  host: ""                    # default login.<domain>
  apiAudience: bus-api        # `aud` API clients must request, and the API checks
  corsAllowedOrigins: []      # client web origins allowed to call the UI's bearer-token API
  fallbackUrl: ""             # optional (http/https): where an auth page opened directly redirects to; unset shows a 403 page
  authzInternalUrl: http://authz:8081   # Authz's internal REST listener (../Authz); never its gateway route
  resources: {}
  ingress:
    enabled: true
    className: ""
    annotations: {}
    tlsSecretName: ""
    # Never add /api/webhooks or /api/internal (in-cluster only: Kratos, Authz).
    paths: [/oauth, /login, /registration, /verification, /recovery, /settings, /company, /verify-email, /invite, /api/email-verification, /_next]

# Every user event (USER_REGISTERED, ...) is published to this topic by the UI. Kafka is not part of this chart.
kafka:
  brokers: ""                 # host:port[,host:port]
  topic: idp.events

postgres:
  image: postgres:16-alpine
  storageSize: 2Gi
  database: hydra            # created via POSTGRES_DB (first boot)
  extraDatabases: [kratos]   # first boot only: add later ones by hand (see postgres.yaml)
  username: hydra            # one role shared by both databases
  resources: {}

# Ory Hydra (official chart). Its own values sit one level in: hydra.hydra.*.
# The config that is the same everywhere is config/hydra/hydra.yaml, shared with docker-compose and
# mounted from a ConfigMap as a second --config. What differs per environment (issuer, login /
# consent / logout URLs) is set in helmvars/ under hydra.hydra.config.
# Secrets: the pre-created idp-hydra (secretsSystem, secretsCookie) and idp-postgres (dsn, via extraEnv).
hydra:
  enabled: true
  fullnameOverride: idp-hydra   # Service names: idp-hydra-admin, idp-hydra-public
  maester: { enabled: false }
  secret: { enabled: false, nameOverride: idp-hydra }
  hydra:
    automigration: { enabled: true }
    customArgs: [serve, all, --config, /etc/config/hydra.yaml, --config, /etc/hydra/hydra.yaml]
  deployment:
    extraEnv:
      - name: DSN
        valueFrom: { secretKeyRef: { name: idp-postgres, key: dsn } }
    extraVolumes:
      - name: extra
        configMap: { name: idp-hydra-extra }
    extraVolumeMounts:
      - { name: extra, mountPath: /etc/hydra, readOnly: true }

# Ory Kratos: private, only the UI calls it (see templates/kratos-networkpolicy.yaml). Its own
# values sit one level in: kratos.kratos.*.
# Kratos' config is config/kratos/, shared with docker-compose, mounted from a ConfigMap and passed
# as extra --config files. Secret idp-kratos: dsn, secretsDefault, secretsCookie, secretsCipher
# (exactly 32 bytes). A missing key fails at pod start, not at helm template.
kratos:
  enabled: true
  fullnameOverride: idp-kratos
  secret: { enabled: false, nameOverride: idp-kratos }
  courier: { enabled: false }   # the subchart's mail catcher; the courier worker runs in the Kratos pod
  kratos:
    automigration: { enabled: true }
  deployment:
    extraArgs:
      - --watch-courier   # sends the OTP / recovery-code messages (to the UI webhook -> Kafka)
      - --config=/etc/kratos/kratos.yaml
      - --config=/etc/kratos/selfservice.yaml
      - --config=/etc/kratos/courier.yaml
    extraVolumes:
      - name: extra
        configMap: { name: idp-kratos-extra }
    extraVolumeMounts:
      - { name: extra, mountPath: /etc/kratos, readOnly: true }
