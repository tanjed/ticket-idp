# Local Kratos config, mirrors chart/values.yaml's kratos.kratos.config
# block. Verified against a real Kratos v26.2.0 binary (docker run oryd/
# kratos:v26.2.0 serve all --config) while writing this.
identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/identity.default.schema.json
selfservice:
  # Served by the Next.js UI in ./ui (compose service `ui`, port 3001).
  default_browser_return_url: http://localhost:3001/
  allowed_return_urls: [http://localhost:3001/]
  methods:
    password:
      enabled: true
    # Emailed / SMS'd one-time codes: used by verification and recovery.
    code:
      enabled: true
  flows:
    login:
      ui_url: http://localhost:3001/login
    registration:
      ui_url: http://localhost:3001/registration
      # Single form (profile traits + password together), matching the UI
      # design. Default is two-step: profile first, password on a second screen.
      enable_legacy_one_step: true
      after:
        password:
          hooks:
            - hook: session
            # Sends the new user to /verification to confirm email / phone.
            - hook: show_verification_ui
    verification:
      enabled: true
      use: code
      ui_url: http://localhost:3001/verification
      after:
        default_browser_return_url: http://localhost:3001/
    # "Forgot password": code by email / SMS, then a privileged session that
    # lands on /settings to choose a new password.
    recovery:
      enabled: true
      use: code
      ui_url: http://localhost:3001/recovery
    settings:
      ui_url: http://localhost:3001/settings
serve:
  public:
    base_url: http://localhost:4433/
  admin:
    base_url: http://localhost:4434/
courier:
  # Fire and forget: Kratos queues each message and POSTs it (recipient,
  # template, code) to an external notification service, which owns the real
  # email / SMS delivery. PLACEHOLDER URLs: point them at that service.
  delivery_strategy: http
  http:
    request_config:
      url: http://notification-service.invalid/v1/email
      method: POST
      headers:
        Content-Type: application/json
      body: file:///etc/config/courier.body.jsonnet
  channels:
    - id: sms
      type: http
      request_config:
        url: http://notification-service.invalid/v1/sms
        method: POST
        headers:
          Content-Type: application/json
        body: file:///etc/config/courier.body.jsonnet
  smtp:
    # Not used (delivery_strategy: http), but Kratos's config schema still
    # requires a well-formed SMTP URI.
    connection_uri: smtps://placeholder:placeholder@localhost:1025/?skip_ssl_verify=true
